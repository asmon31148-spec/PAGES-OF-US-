name: pages_of_us
description: "Pages of Us — Sanctuary for Two"
publish_to: "none"
version: 1.0.33+34

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Firebase Core & Cloud Services
  firebase_core: ^3.10.1
  firebase_auth: ^5.4.1
  cloud_firestore: ^5.6.2
  firebase_messaging: ^15.2.1
  google_sign_in: ^6.2.2

  # Supabase Realtime & PostgreSQL Store
  supabase_flutter: ^2.8.3

  # State Management & Local Instant Cache
  provider: ^6.1.2
  shared_preferences: ^2.3.5

  # Native Android Home Screen Locket Widget
  home_widget: ^0.7.0

  # Hardware Sensors & Native Features
  geolocator: ^13.0.2
  image_picker: ^1.1.2
  file_picker: ^8.1.7
  audioplayers: ^6.1.2
  audio_service: ^0.18.19
  youtube_explode_dart: ^3.1.0
  video_player: ^2.9.2
  record: ^7.1.2

  # UI, Maps, Animations & Utilities
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  flutter_animate: ^4.5.2
  confetti: ^0.8.0
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  intl: ^0.20.2
  http: ^1.3.0
  uuid: ^4.5.1
  flutter_svg: ^2.0.17
  cached_network_image: ^3.4.1
  open_filex: ^4.5.0
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

dependency_overrides:
  unicode: any
  path: 1.9.0

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/audio/
