name: Build Native Android APK (Flutter)

on:
  push:
    branches: [ main, master, flutter-migration ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Flutter Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Ensure Permanent Keystore & Extract Fingerprints
        id: cert_fingerprints
        run: |
          mkdir -p android/app
          if [ ! -f "android/app/pagesofus.jks" ]; then
            echo "Generating permanent release keystore..."
            keytool -genkeypair -v -keystore android/app/pagesofus.jks -storetype JKS \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -alias pagesofus -storepass pagesofus123 -keypass pagesofus123 \
              -dname "CN=PagesOfUs, OU=Mobile, O=PagesOfUs, L=SanFrancisco, S=CA, C=US"
            
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add android/app/pagesofus.jks
            git commit -m "chore: persist permanent release signing keystore [skip ci]" || true
            git push origin ${{ github.ref_name }} || true
          fi

          echo "Extracting SHA fingerprints..."
          CERT_INFO=$(keytool -list -v -keystore android/app/pagesofus.jks -alias pagesofus -storepass pagesofus123)
          SHA1=$(echo "$CERT_INFO" | grep "SHA1:" | head -n 1 | awk '{print $2}')
          SHA256=$(echo "$CERT_INFO" | grep "SHA256:" | head -n 1 | awk '{print $2}')
          echo "sha1=$SHA1" >> $GITHUB_OUTPUT
          echo "sha256=$SHA256" >> $GITHUB_OUTPUT
          echo "=========================================================="
          echo "PERMANENT RELEASE SHA-1:   $SHA1"
          echo "PERMANENT RELEASE SHA-256: $SHA256"
          echo "=========================================================="

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify google-services.json
        run: |
          if [ ! -f "android/app/google-services.json" ]; then
            if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
              echo "${{ secrets.GOOGLE_SERVICES_JSON }}" > android/app/google-services.json
              echo "Wrote google-services.json from secret"
            else
              echo "Warning: google-services.json not found in android/app and no secret configured"
            fi
          else
            echo "google-services.json found in repository"
          fi

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Analyze Project
        run: flutter analyze || true

      - name: Build Release APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Extract App Version
        id: app_version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | head -n 1 | awk '{print $2}' | cut -d'+' -f1)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Target Release Version: v$VERSION"

      - name: Copy Renamed APK for Direct Download
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/PagesOfUs.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Release APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/flutter-migration'
        with:
          tag_name: v${{ steps.app_version.outputs.version }}
          name: "Pages of Us v${{ steps.app_version.outputs.version }} — Sanctuary Edition"
          make_latest: true
          body: |
            ### ✨ What's New in Pages of Us v${{ steps.app_version.outputs.version }}

            - **💖 Daily Care & Checkup Routine**:
              - Schedule loving reminders for your partner (hydration, vitamins, meals, wind-down).
              - Real-time dual perspective: see partner checkoffs instantly with sweet care notes.
              - One-tap gentle care nudges with warm vibration.

            - **🗺️ Our World & Live Partner Tether**:
              - True full-screen interactive world map with smooth camera flight to your partner.
              - Real-time mutual distance calculation and midpoint badge.
              - Removed map accuracy circles for a clean, unobstructed view.

            - **✨ Celestial Pulse Beacon**:
              - Replaced static heart with illuminated celestial pulse beacon.
              - Triple concentric expanding fluid ripples and glowing connecting tether line.
              - Floating pill toast and synchronized dual-phone tactile response.

            - **🎨 Illuminated Highlight Memories**:
              - Aesthetic dynamic backdrops for Voice Whispers, Live Tether, and Milestone Dreams.
              - Luminous audio soundwave visualizer and celestial radar motifs.

            - **🔒 Vault Sanctuary & Custom Audio**:
              - Upload your own custom background songs (.mp3, .m4a) to any Vault.
              - Clean empty state with zero dummy templates.
              - Intelligent audio ducking when listening to voice memos.

            - **🎶 Music Sanctuary & Ambient Soundscapes**:
              - Curated offline sanctuary audio (Lofi, Rain, Ocean, Fireplace, Birds).
              - Live interactive track search and permanently persisted playlists.

            - **⚡ Performance & Polish**:
              - Full edge-to-edge layout matching modern luxury aesthetics.
              - Complete fix for AI question selection blackout and debounced cloud pinning.
              - 100% pure native Flutter speed with zero lag.
          files: |
            build/app/outputs/flutter-apk/PagesOfUs.apk
            build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
