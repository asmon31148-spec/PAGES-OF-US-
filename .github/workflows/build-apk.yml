name: Build Native Android APK (Flutter)

on:
  push:
    branches: [ main, master, flutter-migration ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Flutter Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Ensure Permanent Keystore & Extract Fingerprints
        id: cert_fingerprints
        run: |
          mkdir -p android/app
          if [ ! -f "android/app/pagesofus.jks" ]; then
            echo "Generating permanent release keystore..."
            keytool -genkeypair -v -keystore android/app/pagesofus.jks -storetype JKS \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -alias pagesofus -storepass pagesofus123 -keypass pagesofus123 \
              -dname "CN=PagesOfUs, OU=Mobile, O=PagesOfUs, L=SanFrancisco, S=CA, C=US"
            
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add android/app/pagesofus.jks
            git commit -m "chore: persist permanent release signing keystore [skip ci]" || true
            git push origin ${{ github.ref_name }} || true
          fi

          echo "Extracting SHA fingerprints..."
          CERT_INFO=$(keytool -list -v -keystore android/app/pagesofus.jks -alias pagesofus -storepass pagesofus123)
          SHA1=$(echo "$CERT_INFO" | grep "SHA1:" | head -n 1 | awk '{print $2}')
          SHA256=$(echo "$CERT_INFO" | grep "SHA256:" | head -n 1 | awk '{print $2}')
          echo "sha1=$SHA1" >> $GITHUB_OUTPUT
          echo "sha256=$SHA256" >> $GITHUB_OUTPUT
          echo "=========================================================="
          echo "PERMANENT RELEASE SHA-1:   $SHA1"
          echo "PERMANENT RELEASE SHA-256: $SHA256"
          echo "=========================================================="

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify google-services.json
        run: |
          if [ ! -f "android/app/google-services.json" ]; then
            if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
              echo "${{ secrets.GOOGLE_SERVICES_JSON }}" > android/app/google-services.json
              echo "Wrote google-services.json from secret"
            else
              echo "Warning: google-services.json not found in android/app and no secret configured"
            fi
          else
            echo "google-services.json found in repository"
          fi

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Analyze Project
        run: flutter analyze || true

      - name: Build Release APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Copy Renamed APK for Direct Download
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/PagesOfUs.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Release APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/flutter-migration'
        with:
          tag_name: latest
          name: "Pages of Us — Native Flutter Android"
          body: |
            ### 🌿 Pages of Us — Native Flutter Android App
            Direct 1-tap download for Android.
            
            - **Native Engine**: 100% Pure Flutter / Dart (Zero WebView latency)
            - **Application ID**: `com.pagesofus.app`
            - **Signing Certificate SHA-1**: `${{ steps.cert_fingerprints.outputs.sha1 }}`
            - **Signing Certificate SHA-256**: `${{ steps.cert_fingerprints.outputs.sha256 }}`
            
            #### 🔑 Firebase Google Sign-In Setup
            If Google Sign-In gives Code 10, add this SHA-1 to your Firebase Console:
            1. Open [Firebase Console](https://console.firebase.google.com/project/soulmate-p1/settings/general) -> **Project Settings**
            2. Scroll down to **Your apps** -> Select `com.pagesofus.app`
            3. Click **Add fingerprint** and paste: `${{ steps.cert_fingerprints.outputs.sha1 }}`
            4. Verify **Google** is enabled under **Authentication -> Sign-in method**
          files: |
            build/app/outputs/flutter-apk/PagesOfUs.apk
            build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
