name: Build Native Android APK (Flutter)

on:
  push:
    branches: [ main, master, flutter-migration ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Flutter Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Ensure Permanent Keystore & Extract Fingerprints
        id: cert_fingerprints
        run: |
          mkdir -p android/app
          if [ ! -f "android/app/pagesofus.jks" ]; then
            echo "Generating permanent release keystore..."
            keytool -genkeypair -v -keystore android/app/pagesofus.jks -storetype JKS \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -alias pagesofus -storepass pagesofus123 -keypass pagesofus123 \
              -dname "CN=PagesOfUs, OU=Mobile, O=PagesOfUs, L=SanFrancisco, S=CA, C=US"
            
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add android/app/pagesofus.jks
            git commit -m "chore: persist permanent release signing keystore [skip ci]" || true
            git push origin ${{ github.ref_name }} || true
          fi

          echo "Extracting SHA fingerprints..."
          CERT_INFO=$(keytool -list -v -keystore android/app/pagesofus.jks -alias pagesofus -storepass pagesofus123)
          SHA1=$(echo "$CERT_INFO" | grep "SHA1:" | head -n 1 | awk '{print $2}')
          SHA256=$(echo "$CERT_INFO" | grep "SHA256:" | head -n 1 | awk '{print $2}')
          echo "sha1=$SHA1" >> $GITHUB_OUTPUT
          echo "sha256=$SHA256" >> $GITHUB_OUTPUT
          echo "=========================================================="
          echo "PERMANENT RELEASE SHA-1:   $SHA1"
          echo "PERMANENT RELEASE SHA-256: $SHA256"
          echo "=========================================================="

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify google-services.json
        run: |
          if [ ! -f "android/app/google-services.json" ]; then
            if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
              echo "${{ secrets.GOOGLE_SERVICES_JSON }}" > android/app/google-services.json
              echo "Wrote google-services.json from secret"
            else
              echo "Warning: google-services.json not found in android/app and no secret configured"
            fi
          else
            echo "google-services.json found in repository"
          fi

      - name: Disable Web Support & Clean Stale Artifacts
        run: |
          flutter config --no-enable-web
          rm -rf web/ build/ .dart_tool/
          rm -f index.html
          flutter clean

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Analyze Project
        run: |
          flutter analyze > analyze_log.txt 2>&1 || true
          cat analyze_log.txt

      - name: Build Release APK
        run: |
          set +e
          flutter build apk --release --android-skip-build-dependency-validation > build_log.txt 2>&1
          EXIT_CODE=$?
          echo "=================== FLUTTER BUILD LOG TAIL ==================="
          tail -n 120 build_log.txt
          echo "==============================================================="
          exit $EXIT_CODE

      - name: Commit Build Log on Failure
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          echo "=== FLUTTER ANALYZE ===" > BUILD_ERROR.txt
          cat analyze_log.txt >> BUILD_ERROR.txt 2>/dev/null || true
          echo "=== FLUTTER BUILD LOG ===" >> BUILD_ERROR.txt
          tail -n 250 build_log.txt >> BUILD_ERROR.txt 2>/dev/null || true
          git add BUILD_ERROR.txt
          git commit -m "chore: record build error log [skip ci]" || true
          git push origin ${{ github.ref_name }} || true

      - name: Upload Diagnostic Build Log on Failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build_log.txt
          retention-days: 7

      - name: Extract App Version
        id: app_version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | head -n 1 | awk '{print $2}' | cut -d'+' -f1)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Target Release Version: v$VERSION"

      - name: Copy Renamed APK for Direct Download
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/PagesOfUs.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Release APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/flutter-migration'
        with:
          tag_name: v${{ steps.app_version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: "Pages of Us v${{ steps.app_version.outputs.version }} — Sanctuary Edition"
          make_latest: true
          body: |
            ### ✨ What's New in Pages of Us v${{ steps.app_version.outputs.version }}

            - **🎙️ Instant Voice Audio (<20ms Start)**:
              - Built-in local audio disk caching: voice memos and whisper notes cache on first play to eliminate the 1.5s–2.5s network lag and buffering clicks.
              - Instantaneous native audio playback with zero stutter.

            - **⚡ Silky 60 FPS Playback & Zero Rebuild Thrashing**:
              - Eliminated the 10x/second periodic timer spamming the native audio platform channel.
              - Scoped Timeline and Memories screen listeners so thousands of lines of UI never re-render during audio playback.
              - Smooth, lightweight waveform scrubbing.

            - **🎶 Non-Blocking Audio Ducking**:
              - Ambient soundscapes and background music pause asynchronously without stalling the main UI thread.
          files: |
            build/app/outputs/flutter-apk/PagesOfUs.apk
            build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
