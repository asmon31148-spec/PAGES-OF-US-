name: Build Native Android APK (Flutter)

on:
  push:
    branches: [ main, master, flutter-migration ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Flutter Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify google-services.json
        run: |
          if [ ! -f "android/app/google-services.json" ]; then
            if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
              echo "${{ secrets.GOOGLE_SERVICES_JSON }}" > android/app/google-services.json
              echo "Wrote google-services.json from secret"
            else
              echo "Warning: google-services.json not found in android/app and no secret configured"
            fi
          else
            echo "google-services.json found in repository"
          fi

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Analyze Project
        run: flutter analyze || true

      - name: Build Release APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Copy Renamed APK for Direct Download
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/PagesOfUs.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Release APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/flutter-migration'
        with:
          tag_name: latest
          name: "Pages of Us — Native Flutter Android"
          body: |
            ### 🌿 Pages of Us — Native Flutter Android App
            Direct 1-tap download for Android.
            
            - **Native Engine**: 100% Pure Flutter / Dart (Zero WebView latency)
            - **Application ID**: `com.pagesofus.app`
            - **Included**: Instant 0ms local cache on boot, Native Home Screen Locket Widget, Ambient Sanctuary Music, Realtime Presence & Mood Aura.
          files: |
            build/app/outputs/flutter-apk/PagesOfUs.apk
            build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
