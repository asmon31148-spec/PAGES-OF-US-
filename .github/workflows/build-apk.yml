name: Build Native Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm install

      - name: Generate App Icons
        run: node scripts/generate-icons.cjs

      - name: Build Web Application
        run: npm run build

      - name: Sync Web Assets to Android
        run: npx cap sync android

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Android Debug APK and Print Fingerprint
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          ./gradlew signingReport
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/PagesOfUs.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PagesOfUs-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Release APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: "Pages of Us — Sanctuary for Two (Android)"
          body: |
            ### 🌿 Pages of Us — Native Android App
            Direct 1-tap download for Android.
            
            - **App Name**: Pages of Us
            - **Package**: `com.pagesofus.app`
            - **New**: Custom Velvet Sanctuary App Icon & Adaptive Icon
            - **Features**: Dual World Clocks, Real-time GPS Tether, Synchronized Live Touch Pad, Android Home Screen Locket Widget, Ambient Sanctuary Music with Smart Ducking.
          files: |
            android/app/build/outputs/apk/debug/PagesOfUs.apk
            android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
